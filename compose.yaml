services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: travel-mssql
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TravelDB!2026Local"

    ports:
      - "1433:1433"

    volumes:
      - travel-mssql-data:/var/opt/mssql

volumes:
  travel-mssql-data: